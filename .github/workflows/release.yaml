name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: # 手動リカバリ/再公開用（changeset が無くても未公開版があれば publish）

# 公開処理の多重実行を防ぐ（実行中はキャンセルしない）
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # バージョン commit / tag の push, GitHub Release 作成
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog-github の commit->PR 解決とタグ操作に必要

      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # .changeset/*.md（README.md 以外）の有無で「バージョンを上げるか」を判定
      - name: Detect changesets
        id: detect
        run: |
          COUNT=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "changeset files: $COUNT"

      # 1) changeset があればバージョンを上げ CHANGELOG を生成（ローカル commit のみ・push はまだ）
      - name: Version
        if: steps.detect.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run version-packages
          git add -A
          git commit -m "chore: release [skip ci]"

      # 2) npm へ公開（未公開版のみ・冪等）。push より先に publish し、失敗時の不整合を防ぐ。
      #    実際に公開したか(published)と版番号(version)を後続ステップへ受け渡す。
      - name: Publish to npm
        id: publish
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm run release | tee publish.log
          if grep -q "packages published successfully" publish.log; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f publish.log
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # 3) 版 commit を main へ反映（版commitが無ければ no-op）
      - name: Push version commit
        run: |
          set -euo pipefail
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4) 実際に公開した場合のみ、タグ push と GitHub Release 作成（冪等）
      - name: Tag and GitHub Release
        if: steps.publish.outputs.published == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.publish.outputs.version }}"
          TAG="v${VERSION}"
          # changeset publish が同名タグを作成済みでも失敗させない
          git tag -a "$TAG" -m "$TAG" 2>/dev/null || true
          git push origin "refs/tags/${TAG}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES=$(awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md)
            gh release create "$TAG" --title "$TAG" --notes "$NOTES" --verify-tag
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
